<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MechVault{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="nav">
  <a class="brand" href="/">⚙️ MechVault</a>
  <div class="nav-links">
    <a href="/">Browse</a>
    {% if user %}<a href="/dashboard">Dashboard</a>{% endif %}
    {% if user and user.role == 'owner' %}<a href="/admin">Admin</a>{% endif %}
    {% if user %}
      <span class="nav-user">{{ user.name or user.email }}</span>
      <form method="post" action="/logout" class="nav-logout"><button class="btn-ghost">Logout</button></form>
    {% else %}
      <a class="btn-primary" href="/login">Login</a>
      <a class="btn-secondary" href="/register">Sign up</a>
    {% endif %}
  </div>
</nav>
<main class="container">
  {% block content %}{% endblock %}
</main>
<footer class="footer">MechVault · BIT Mesra Mechanical Engineering · running on a Raspberry Pi 5</footer>
</body>
</html>
